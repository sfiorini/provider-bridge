name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: CGO_ENABLED=0 go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            package: providerbridge_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            package: providerbridge_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            package: providerbridge_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            package: providerbridge_darwin_arm64.tar.gz
          - goos: windows
            goarch: amd64
            binary: providerbridge.exe
            package: providerbridge_windows_amd64.zip
          - goos: windows
            goarch: arm64
            binary: providerbridge.exe
            package: providerbridge_windows_arm64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BINARY: ${{ matrix.binary || 'providerbridge' }}
        run: |
          mkdir -p build dist
          VERSION="$(cat VERSION)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags="-s -w \
            -X providerbridge/internal/service/api.version=${VERSION} \
            -X providerbridge/internal/service/api.buildTime=${BUILD_TIME} \
            -X providerbridge/internal/service/api.goVersion=$(go env GOVERSION)" \
            -o "build/${BINARY}" ./cmd/providerbridge

      - name: Package binary
        env:
          GOOS: ${{ matrix.goos }}
          BINARY: ${{ matrix.binary || 'providerbridge' }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "${GOOS}" = "windows" ]; then
            (cd build && zip "../dist/${PACKAGE}" "${BINARY}")
          else
            tar -C build -czf "dist/${PACKAGE}" "${BINARY}"
          fi

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error
          archive: false

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches VERSION file
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "tag ${TAG} does not match VERSION ${VERSION}" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build and push Docker image to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker build --build-arg VERSION="${VERSION}" \
            -t "ghcr.io/sfiorini/provider-bridge:${VERSION}" \
            -t "ghcr.io/sfiorini/provider-bridge:latest" .
          docker push "ghcr.io/sfiorini/provider-bridge:${VERSION}"
          docker push "ghcr.io/sfiorini/provider-bridge:latest"

      - name: Extract release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v ver="## [${VERSION}]" '
            index($0, ver) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "Release ${TAG}" > release-notes.md

      - name: Create GitHub release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" --title "${TAG}" \
            --notes-file release-notes.md --verify-tag
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | while read -r asset; do
            echo "Uploading: ${asset}"
            gh release upload "${TAG}" "${asset}" --clobber
          done
