# DeepSeek V4 extension configuration example
# Merge this fragment into config.yml; extension config is read from the main
# config's extensions slots.

extensions:
  deepseek_v4:
    config:
      # Inject a reminder before the last user turn to reinforce system-prompt
      # compliance.
      reinforce_instructions: true

      # Custom reminder text; an empty string disables the feature.
      reinforce_prompt: "[System Reminder]: Please pay close attention to the system instructions, AGENTS.md files, and any other context provided. Follow them carefully and completely in your response.\n[User]:"

provider:
  providers:
    deepseek:
      models:
        deepseek-v4-pro:
          extensions:
            deepseek_v4:
              enabled: true
